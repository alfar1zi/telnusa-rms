# TELNUSA NMS Apache 2.4 Reverse Proxy & Static Hosting Configuration
# CANONICAL PRODUCTION APACHE CONFIGURATION

<VirtualHost *:80>
    ServerName nms.example.com
    ServerAlias nms.telnusa.internal nms.example.test
    DocumentRoot /var/www/telnusa-nms/dist

    <Directory /var/www/telnusa-nms/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # SPA fallback routing
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_URI} !^/api/
        RewriteCond %{REQUEST_URI} !^/guacamole/
        RewriteCond %{REQUEST_URI} !^/grafana/
        RewriteRule ^ /index.html [L]
    </Directory>

    # API and SSE proxying to Python backend daemon
    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:8080/api/
    ProxyPassReverse /api/ http://127.0.0.1:8080/api/

    # An SSH session is long-lived; the default 60s proxy timeout would cut it.
    # ProxyTimeout is only valid in server/vhost context, not inside <Location>.
    ProxyTimeout 3600

    # Guacamole terminal (signed-JSON auth). flushpackets=on
    # is mandated by upstream for the HTTP tunnel; the client also attempts a
    # WebSocket upgrade, so proxy it explicitly AFTER this generic mapping
    # (Apache gives priority to the last matching Location).
    ProxyPass        /guacamole/ http://127.0.0.1:8081/guacamole/ flushpackets=on
    ProxyPassReverse /guacamole/ http://127.0.0.1:8081/guacamole/

    <Location /guacamole/websocket-tunnel>
        ProxyPass ws://127.0.0.1:8081/guacamole/websocket-tunnel
        ProxyPassReverse ws://127.0.0.1:8081/guacamole/websocket-tunnel
    </Location>


    # Grafana reverse proxy and WebSocket live updates
    <Location /grafana/api/live/ws>
        ProxyPass ws://127.0.0.1:3000/grafana/api/live/ws
        ProxyPassReverse ws://127.0.0.1:3000/grafana/api/live/ws
    </Location>

    <Location /grafana/>
        ProxyPass http://127.0.0.1:3000/grafana/
        ProxyPassReverse http://127.0.0.1:3000/grafana/
        Header always set X-Frame-Options "SAMEORIGIN"
    </Location>

    # Allow SAMEORIGIN framing specifically for Remote WebUI reverse proxy
    <Location /api/remote/>
        Header always set X-Frame-Options "SAMEORIGIN"
    </Location>

    # Security headers (DENY by default for all ordinary portal pages)
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-XSS-Protection "0"

    ErrorLog ${APACHE_LOG_DIR}/telnusa-nms_error.log
    CustomLog ${APACHE_LOG_DIR}/telnusa-nms_access.log combined
</VirtualHost>
