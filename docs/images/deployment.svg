<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 848 928" width="848" height="928" role="img" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Deployment view, one runtime host</title>
  <desc>Field devices behind a private overlay, and one Ubuntu host carrying ingress, the TELNUSA NMS service with SQLite state, the monitoring core with Zabbix, MySQL and Grafana, and the Guacamole console gateway.</desc>
  <defs>
    <marker id="flow" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#59636e"/>
    </marker>
  </defs>

  <rect width="848" height="928" fill="#ffffff"/>
  <text x="24" y="44" font-size="18" font-weight="600" fill="#1f2328">Deployment view, one runtime host</text>
  <text x="24" y="66" font-size="12.5" fill="#59636e">Field devices sit behind a private overlay. One host carries ingress, application, monitoring and remote access.</text>

  <g font-size="11.5" fill="#59636e">
    <rect x="24" y="84" width="14" height="14" rx="2" fill="none" stroke="#d0d7de"/>
    <text x="44" y="95">Element</text>
    <rect x="128" y="84" width="14" height="14" rx="2" fill="none" stroke="#0969da" stroke-width="1.5"/>
    <text x="148" y="95">Application</text>
    <circle cx="257" cy="91" r="7" fill="#0969da"/>
    <text x="270" y="95">Flow step</text>
  </g>
  <line x1="24" y1="110" x2="824" y2="110" stroke="#d0d7de"/>

  <text x="24" y="134" font-size="11" font-weight="600" fill="#59636e" letter-spacing="0.32">FIELD AND OVERLAY</text>
  <text x="448" y="134" font-size="11" font-weight="600" fill="#59636e" letter-spacing="0.32">RUNTIME HOST</text>

  <rect x="24" y="148" width="368" height="172" rx="8" fill="none" stroke="#d0d7de"/>
  <text x="40" y="174" font-size="15" font-weight="600" fill="#1f2328">Teltonika RUT906</text>
  <text x="40" y="192" font-size="12" fill="#59636e">site site-a, serial and epoch in every payload</text>
  <line x1="40" y1="204" x2="376" y2="204" stroke="#d8dee4"/>
  <g font-size="13">
    <text x="40" y="228" fill="#1f2328">MPPT charge controller</text>
    <text x="376" y="228" fill="#59636e" text-anchor="end">unit 2</text>
    <text x="40" y="252" fill="#1f2328">three-phase energy meter</text>
    <text x="376" y="252" fill="#59636e" text-anchor="end">unit 1</text>
    <text x="40" y="276" fill="#1f2328">pyranometer</text>
    <text x="376" y="276" fill="#59636e" text-anchor="end">unit 3</text>
    <text x="40" y="300" fill="#1f2328">bus, poll, publish</text>
    <text x="376" y="300" fill="#59636e" text-anchor="end">9600 8N1, 20 s, 12 fields</text>
  </g>

  <rect x="24" y="336" width="368" height="148" rx="8" fill="none" stroke="#d0d7de"/>
  <text x="40" y="362" font-size="15" font-weight="600" fill="#1f2328">ZeroTier overlay</text>
  <text x="40" y="380" font-size="12" fill="#59636e">private network, no public port</text>
  <line x1="40" y1="392" x2="376" y2="392" stroke="#d8dee4"/>
  <g font-size="13">
    <text x="40" y="416" fill="#1f2328">members</text>
    <text x="376" y="416" fill="#59636e" text-anchor="end">host and router</text>
    <text x="40" y="440" fill="#1f2328">carries</text>
    <text x="376" y="440" fill="#59636e" text-anchor="end">telemetry, WebUI, SSH</text>
    <text x="40" y="464" fill="#1f2328">addressing</text>
    <text x="376" y="464" fill="#59636e" text-anchor="end">private range</text>
  </g>

  <rect x="24" y="500" width="368" height="92" rx="8" fill="none" stroke="#d0d7de"/>
  <text x="40" y="526" font-size="15" font-weight="600" fill="#1f2328">Targets resolved on the server</text>
  <line x1="40" y1="538" x2="376" y2="538" stroke="#d8dee4"/>
  <text x="40" y="562" font-size="13" fill="#59636e">from the device registry, never from the browser</text>

  <rect x="448" y="148" width="376" height="104" rx="8" fill="none" stroke="#0969da" stroke-width="1.5"/>
  <text x="464" y="174" font-size="15" font-weight="600" fill="#1f2328">Ingress, Apache 2.4</text>
  <text x="464" y="192" font-size="12" fill="#59636e">the only way into the host</text>
  <line x1="464" y1="204" x2="808" y2="204" stroke="#d8dee4"/>
  <g font-size="13">
    <text x="464" y="228" fill="#1f2328">serves</text>
    <text x="808" y="228" fill="#59636e" text-anchor="end">static build, TLS</text>
    <text x="464" y="250" fill="#1f2328">proxies</text>
    <text x="808" y="250" fill="#59636e" text-anchor="end">/api and /guacamole</text>
  </g>

  <rect x="448" y="268" width="376" height="152" rx="8" fill="none" stroke="#0969da" stroke-width="1.5"/>
  <text x="464" y="294" font-size="15" font-weight="600" fill="#1f2328">TELNUSA NMS</text>
  <text x="464" y="312" font-size="12" fill="#59636e">systemd service, Python, loopback bind</text>
  <line x1="464" y1="324" x2="808" y2="324" stroke="#d8dee4"/>
  <g font-size="13">
    <text x="464" y="348" fill="#1f2328">ingest</text>
    <text x="808" y="348" fill="#59636e" text-anchor="end">HTTPS and MQTT</text>
    <text x="464" y="372" fill="#1f2328">workers</text>
    <text x="808" y="372" fill="#59636e" text-anchor="end">delivery, retention</text>
    <text x="464" y="396" fill="#1f2328">secrets</text>
    <text x="808" y="396" fill="#59636e" text-anchor="end">service environment</text>
  </g>

  <rect x="448" y="436" width="376" height="104" rx="8" fill="none" stroke="#d0d7de"/>
  <text x="464" y="462" font-size="15" font-weight="600" fill="#1f2328">State, SQLite</text>
  <text x="464" y="480" font-size="12" fill="#59636e">one file, owned by the service user</text>
  <line x1="464" y1="492" x2="808" y2="492" stroke="#d8dee4"/>
  <g font-size="13">
    <text x="464" y="516" fill="#1f2328">devices, queue, audit</text>
    <text x="808" y="516" fill="#59636e" text-anchor="end">retention bounded</text>
  </g>

  <rect x="448" y="556" width="376" height="176" rx="8" fill="none" stroke="#d0d7de"/>
  <text x="464" y="582" font-size="15" font-weight="600" fill="#1f2328">Monitoring core</text>
  <text x="464" y="600" font-size="12" fill="#59636e">Zabbix 7.4, MySQL 8.4, Grafana 13</text>
  <line x1="464" y1="612" x2="808" y2="612" stroke="#d8dee4"/>
  <g font-size="13">
    <text x="464" y="636" fill="#1f2328">hosts and items</text>
    <text x="808" y="636" fill="#59636e" text-anchor="end">one host per serial, 12 items</text>
    <text x="464" y="660" fill="#1f2328">history and problems</text>
    <text x="808" y="660" fill="#59636e" text-anchor="end">rollups, alarms</text>
    <text x="464" y="684" fill="#1f2328">dashboards</text>
    <text x="808" y="684" fill="#59636e" text-anchor="end">provisioned from the repo</text>
    <text x="464" y="708" fill="#1f2328">outage</text>
    <text x="808" y="708" fill="#59636e" text-anchor="end">queue absorbs it</text>
  </g>

  <rect x="448" y="748" width="376" height="120" rx="8" fill="none" stroke="#d0d7de"/>
  <text x="464" y="774" font-size="15" font-weight="600" fill="#1f2328">Console and operations</text>
  <text x="464" y="792" font-size="12" fill="#59636e">Guacamole and guacd, unit file, backups</text>
  <line x1="464" y1="804" x2="808" y2="804" stroke="#d8dee4"/>
  <g font-size="13">
    <text x="464" y="828" fill="#1f2328">console grant</text>
    <text x="808" y="828" fill="#59636e" text-anchor="end">signed, single use</text>
    <text x="464" y="852" fill="#1f2328">secrets</text>
    <text x="808" y="852" fill="#59636e" text-anchor="end">outside the repository</text>
  </g>

  <line x1="392" y1="234" x2="440" y2="234" stroke="#59636e" stroke-width="2" marker-end="url(#flow)"/>
  <line x1="392" y1="410" x2="440" y2="410" stroke="#59636e" stroke-width="2" marker-end="url(#flow)"/>
  <g font-size="11.5" fill="#59636e" text-anchor="middle">
    <text x="416" y="226">publish</text>
    <text x="416" y="402">overlay</text>
  </g>

  <line x1="24" y1="884" x2="824" y2="884" stroke="#d0d7de"/>
  <text x="24" y="904" font-size="11.5" fill="#59636e">One machine carries ingress, application, monitoring and remote access.</text>
  <text x="24" y="920" font-size="11.5" fill="#59636e">Source: host and service configuration read on 22 October 2026. Version 3</text>
</svg>
