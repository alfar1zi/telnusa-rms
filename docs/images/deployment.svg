<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 848 956" width="848" height="956" role="img" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Deployment view, one runtime host</title>
  <desc>Deployment diagram. Field devices reach the platform through a private overlay. One Ubuntu host carries ingress, the TELNUSA NMS service with its SQLite state, the monitoring core with Zabbix, MySQL and Grafana, and the Guacamole console gateway.</desc>
  <defs>
    <marker id="flow" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="848" height="956" fill="#ffffff"/>
  <text x="24" y="44" font-size="18" font-weight="600" fill="#111827">Deployment view, one runtime host</text>
  <text x="24" y="66" font-size="12.5" fill="#4b5563">What runs where: field devices behind a private overlay, one host carrying ingress, application, monitoring and remote access.</text>

  <g font-size="11.5" fill="#4b5563">
    <rect x="24" y="84" width="14" height="14" rx="2" fill="#ffffff" stroke="#d1d5db"/>
    <text x="44" y="95">Device and field</text>
    <rect x="196" y="84" width="14" height="14" rx="2" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="216" y="95">Private overlay</text>
    <rect x="368" y="84" width="14" height="14" rx="2" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="388" y="95">Host service</text>
    <rect x="532" y="84" width="14" height="14" rx="2" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="552" y="95">Data and container</text>
  </g>
  <line x1="24" y1="110" x2="824" y2="110" stroke="#d1d5db"/>

  <!-- left: field and overlay -->
  <rect x="24" y="128" width="368" height="190" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <text x="40" y="154" font-size="15" font-weight="600" fill="#111827">Teltonika RUT906</text>
  <text x="40" y="172" font-size="12" fill="#4b5563">site site-a, serial and epoch in the payload</text>
  <line x1="40" y1="184" x2="376" y2="184" stroke="#e5e7eb"/>
  <g font-size="13">
    <text x="40" y="208" fill="#374151">MPPT charge controller</text>
    <text x="376" y="208" fill="#334155" text-anchor="end">unit 2</text>
    <text x="40" y="230" fill="#374151">three-phase energy meter</text>
    <text x="376" y="230" fill="#334155" text-anchor="end">unit 1</text>
    <text x="40" y="252" fill="#374151">pyranometer</text>
    <text x="376" y="252" fill="#334155" text-anchor="end">unit 3</text>
    <text x="40" y="274" fill="#374151">bus and poll period</text>
    <text x="376" y="274" fill="#334155" text-anchor="end">9600 8N1, 20 s</text>
    <text x="40" y="296" fill="#374151">publishes every 20 s</text>
    <text x="376" y="296" fill="#334155" text-anchor="end">12 fields</text>
  </g>

  <rect x="24" y="334" width="368" height="152" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="40" y="360" font-size="15" font-weight="600" fill="#4c1d95">ZeroTier overlay</text>
  <text x="40" y="378" font-size="12" fill="#6d28d9">private network, no public port</text>
  <line x1="40" y1="390" x2="376" y2="390" stroke="#ddd6fe"/>
  <g font-size="13">
    <text x="40" y="414" fill="#4c1d95">members</text>
    <text x="376" y="414" fill="#6d28d9" text-anchor="end">host and router</text>
    <text x="40" y="436" fill="#4c1d95">carries</text>
    <text x="376" y="436" fill="#6d28d9" text-anchor="end">telemetry, WebUI, SSH</text>
    <text x="40" y="458" fill="#4c1d95">address range</text>
    <text x="376" y="458" fill="#6d28d9" text-anchor="end">private</text>
  </g>

  <rect x="24" y="502" width="368" height="92" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="40" y="528" font-size="15" font-weight="600" fill="#4c1d95">Targets resolved on the server</text>
  <line x1="40" y1="540" x2="376" y2="540" stroke="#ddd6fe"/>
  <text x="40" y="564" font-size="13" fill="#4c1d95">from the device registry, never from the browser</text>

  <!-- right: the host -->
  <rect x="448" y="128" width="376" height="120" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="464" y="154" font-size="15" font-weight="600" fill="#1e3a8a">Ingress, Apache 2.4</text>
  <text x="464" y="172" font-size="12" fill="#1d4ed8">the only way into the host</text>
  <line x1="464" y1="184" x2="808" y2="184" stroke="#bfdbfe"/>
  <g font-size="13">
    <text x="464" y="208" fill="#1e3a8a">serves</text>
    <text x="808" y="208" fill="#1d4ed8" text-anchor="end">static build, TLS</text>
    <text x="464" y="230" fill="#1e3a8a">proxies</text>
    <text x="808" y="230" fill="#1d4ed8" text-anchor="end">/api and /guacamole</text>
  </g>

  <rect x="448" y="264" width="376" height="160" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="464" y="290" font-size="15" font-weight="600" fill="#1e3a8a">TELNUSA NMS</text>
  <text x="464" y="308" font-size="12" fill="#1d4ed8">systemd service, Python, loopback bind</text>
  <line x1="464" y1="320" x2="808" y2="320" stroke="#bfdbfe"/>
  <g font-size="13">
    <text x="464" y="344" fill="#1e3a8a">ingest</text>
    <text x="808" y="344" fill="#1d4ed8" text-anchor="end">HTTPS and MQTT</text>
    <text x="464" y="366" fill="#1e3a8a">workers</text>
    <text x="808" y="366" fill="#1d4ed8" text-anchor="end">delivery, retention</text>
    <text x="464" y="388" fill="#1e3a8a">serves</text>
    <text x="808" y="388" fill="#1d4ed8" text-anchor="end">JSON API and SSE</text>
    <text x="464" y="410" fill="#1e3a8a">secrets</text>
    <text x="808" y="410" fill="#1d4ed8" text-anchor="end">service environment</text>
  </g>

  <rect x="448" y="440" width="376" height="112" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="464" y="466" font-size="15" font-weight="600" fill="#064e3b">State, SQLite</text>
  <text x="464" y="484" font-size="12" fill="#047857">one file, owned by the service user</text>
  <line x1="464" y1="496" x2="808" y2="496" stroke="#a7f3d0"/>
  <g font-size="13">
    <text x="464" y="520" fill="#065f46">devices, queue, audit</text>
    <text x="808" y="520" fill="#047857" text-anchor="end">retention bounded</text>
    <text x="464" y="542" fill="#065f46">sessions</text>
    <text x="808" y="542" fill="#047857" text-anchor="end">stored as digest</text>
  </g>

  <rect x="448" y="568" width="376" height="160" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="464" y="594" font-size="15" font-weight="600" fill="#064e3b">Monitoring core</text>
  <text x="464" y="612" font-size="12" fill="#047857">Zabbix 7.4, MySQL 8.4, Grafana 13</text>
  <line x1="464" y1="624" x2="808" y2="624" stroke="#a7f3d0"/>
  <g font-size="13">
    <text x="464" y="648" fill="#065f46">hosts and items</text>
    <text x="808" y="648" fill="#047857" text-anchor="end">one host per serial, 12 items</text>
    <text x="464" y="670" fill="#065f46">history and problems</text>
    <text x="808" y="670" fill="#047857" text-anchor="end">rollups, alarms</text>
    <text x="464" y="692" fill="#065f46">dashboards</text>
    <text x="808" y="692" fill="#047857" text-anchor="end">provisioned from the repo</text>
    <text x="464" y="714" fill="#065f46">outage</text>
    <text x="808" y="714" fill="#047857" text-anchor="end">queue absorbs it</text>
  </g>

  <rect x="448" y="744" width="376" height="120" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="464" y="770" font-size="15" font-weight="600" fill="#064e3b">Console and operations</text>
  <text x="464" y="788" font-size="12" fill="#047857">Guacamole and guacd, unit file, backups</text>
  <line x1="464" y1="800" x2="808" y2="800" stroke="#a7f3d0"/>
  <g font-size="13">
    <text x="464" y="824" fill="#065f46">console grant</text>
    <text x="808" y="824" fill="#047857" text-anchor="end">signed, single use</text>
    <text x="464" y="846" fill="#065f46">secrets</text>
    <text x="808" y="846" fill="#047857" text-anchor="end">outside the repository</text>
  </g>

  <!-- links between the columns -->
  <line x1="392" y1="223" x2="440" y2="223" stroke="#475569" stroke-width="2" marker-end="url(#flow)"/>
  <text x="416" y="215" font-size="12" fill="#475569" text-anchor="middle">publish</text>
  <line x1="392" y1="410" x2="440" y2="410" stroke="#475569" stroke-width="2" marker-end="url(#flow)"/>
  <text x="416" y="402" font-size="12" fill="#475569" text-anchor="middle">overlay</text>

  <line x1="24" y1="880" x2="824" y2="880" stroke="#d1d5db"/>
  <text x="24" y="900" font-size="11.5" fill="#6b7280">One machine carries ingress, application, monitoring and remote access.</text>
  <text x="24" y="916" font-size="11.5" fill="#6b7280">Source: host and service configuration read on 22 October 2026. Version 2.</text>
</svg>
