<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 848 768" width="848" height="768" role="img" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Field installation and data flow</title>
  <desc>Three Modbus sensors on one RS485 bus, polled by a Teltonika RUT906 every 20 seconds. The router publishes twelve fields to the TELNUSA NMS. Register maps and scale factors are listed per sensor.</desc>
  <defs>
    <marker id="flow" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#59636e"/>
    </marker>
  </defs>

  <rect width="848" height="768" fill="#ffffff"/>
  <text x="24" y="44" font-size="18" font-weight="600" fill="#1f2328">Field installation and data flow</text>
  <text x="24" y="66" font-size="12.5" fill="#59636e">Three Modbus sensors on one RS485 bus, polled by a Teltonika RUT906 every 20 seconds.</text>

  <g font-size="11.5" fill="#59636e">
    <rect x="24" y="84" width="14" height="14" rx="2" fill="none" stroke="#d0d7de"/>
    <text x="44" y="95">Element</text>
    <rect x="128" y="84" width="14" height="14" rx="2" fill="#fff8c5" stroke="#d4a72c"/>
    <text x="148" y="95">Open item</text>
    <circle cx="241" cy="91" r="7" fill="#0969da"/>
    <text x="254" y="95">Flow step</text>
  </g>
  <line x1="24" y1="110" x2="824" y2="110" stroke="#d0d7de"/>

  <text x="24" y="134" font-size="11" font-weight="600" fill="#59636e" letter-spacing="0.32">SENSORS AND BUS</text>
  <text x="472" y="134" font-size="11" font-weight="600" fill="#59636e" letter-spacing="0.32">ROUTER AND PLATFORM</text>

  <rect x="24" y="148" width="408" height="160" rx="8" fill="none" stroke="#d0d7de"/>
  <text x="40" y="174" font-size="15" font-weight="600" fill="#1f2328">MPPT charge controller</text>
  <text x="40" y="192" font-size="12" fill="#59636e">IPANDEE, unit 2, function 3, 12 registers polled</text>
  <line x1="40" y1="204" x2="416" y2="204" stroke="#d8dee4"/>
  <g font-size="13">
    <text x="40" y="228" fill="#1f2328">pv_voltage, reg 2, /10 V</text>
    <text x="416" y="228" fill="#59636e" text-anchor="end">rut.mppt.pv.v</text>
    <text x="40" y="250" fill="#1f2328">charging_current, reg 4, /10 A</text>
    <text x="416" y="250" fill="#59636e" text-anchor="end">rut.mppt.pv.a</text>
    <text x="40" y="272" fill="#1f2328">output_voltage, reg 5, /10 V</text>
    <text x="416" y="272" fill="#59636e" text-anchor="end">rut.mppt.out.v</text>
    <text x="40" y="294" fill="#1f2328">load_current, reg 7, /10 A</text>
    <text x="416" y="294" fill="#59636e" text-anchor="end">rut.mppt.out.a</text>
  </g>

  <rect x="24" y="324" width="408" height="144" rx="8" fill="none" stroke="#d0d7de"/>
  <text x="40" y="350" font-size="15" font-weight="600" fill="#1f2328">Three-phase energy meter</text>
  <text x="40" y="368" font-size="12" fill="#59636e">PZEM-6L24, unit 1, function 4, 8 registers polled</text>
  <line x1="40" y1="380" x2="416" y2="380" stroke="#d8dee4"/>
  <g font-size="13">
    <text x="40" y="404" fill="#1f2328">voltage a/b/c, regs 1, 2, 3, /10</text>
    <text x="416" y="404" fill="#59636e" text-anchor="end">rut.pzem.[abc].voltage</text>
    <text x="40" y="426" fill="#1f2328">current a/b/c, regs 4, 5, 6, /100</text>
    <text x="416" y="426" fill="#59636e" text-anchor="end">rut.pzem.[abc].current</text>
    <text x="40" y="448" fill="#1f2328">energy, reg 59, two registers</text>
    <text x="416" y="448" fill="#59636e" text-anchor="end">rut.pzem.energy.kwh</text>
  </g>

  <rect x="24" y="484" width="408" height="96" rx="8" fill="none" stroke="#d0d7de"/>
  <text x="40" y="510" font-size="15" font-weight="600" fill="#1f2328">Pyranometer</text>
  <text x="40" y="528" font-size="12" fill="#59636e">Honde RD-PSR-01, unit 3, FC3, 16 bit register, MSB first</text>
  <line x1="40" y1="540" x2="416" y2="540" stroke="#d8dee4"/>
  <text x="40" y="564" font-size="13" fill="#1f2328">solar_radiation, reg 1, 1:1 W/m2</text>
  <text x="416" y="564" font-size="13" fill="#59636e" text-anchor="end">rut.solar.radiation</text>

  <rect x="24" y="596" width="408" height="112" rx="8" fill="none" stroke="#d0d7de"/>
  <text x="40" y="622" font-size="15" font-weight="600" fill="#1f2328">RS485 bus</text>
  <text x="40" y="640" font-size="12" fill="#59636e">one master, three slaves, two wire</text>
  <line x1="40" y1="652" x2="416" y2="652" stroke="#d8dee4"/>
  <g font-size="13" fill="#1f2328">
    <text x="40" y="676">port /dev/rs485, exposed as /dev/ttyS1</text>
    <text x="40" y="698">9600 baud, 8 data bits, no parity, half duplex</text>
  </g>

  <rect x="472" y="148" width="352" height="328" rx="8" fill="none" stroke="#0969da" stroke-width="1.5"/>
  <text x="488" y="174" font-size="15" font-weight="600" fill="#1f2328">Teltonika RUT906</text>
  <text x="488" y="192" font-size="12" fill="#59636e">Modbus client and Data Sender</text>
  <line x1="488" y1="204" x2="808" y2="204" stroke="#d8dee4"/>
  <g>
    <circle cx="497" cy="222" r="9" fill="#0969da"/>
    <text x="497" y="226" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">1</text>
    <text x="516" y="226" font-size="13" fill="#1f2328">Modbus client, units 2, 1 and 3</text>

    <circle cx="497" cy="254" r="9" fill="#0969da"/>
    <text x="497" y="258" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">2</text>
    <text x="516" y="258" font-size="13" fill="#1f2328">Combined input, 12 requests</text>

    <circle cx="497" cy="286" r="9" fill="#0969da"/>
    <text x="497" y="290" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">3</text>
    <text x="516" y="290" font-size="13" fill="#1f2328">Lua formatter, scale and identity</text>

    <circle cx="497" cy="318" r="9" fill="#0969da"/>
    <text x="497" y="322" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">4</text>
    <text x="516" y="322" font-size="13" fill="#1f2328">Publish every 20 s</text>
  </g>
  <line x1="488" y1="344" x2="808" y2="344" stroke="#d8dee4"/>
  <g font-size="13">
    <text x="488" y="368" fill="#1f2328">MQTT over TLS, port 8883</text>
    <text x="808" y="368" fill="#59636e" text-anchor="end">disabled</text>
    <text x="488" y="392" fill="#1f2328">HTTPS ingest, port 443</text>
    <text x="808" y="392" fill="#59636e" text-anchor="end">active</text>
    <text x="488" y="416" fill="#59636e">retry 10 times, 1 s timeout</text>
  </g>

  <rect x="472" y="492" width="352" height="112" rx="8" fill="#fff8c5" stroke="#d4a72c"/>
  <text x="488" y="518" font-size="15" font-weight="600" fill="#9a6700">Open items</text>
  <line x1="488" y1="530" x2="808" y2="530" stroke="#d4a72c"/>
  <g font-size="12" fill="#9a6700">
    <text x="488" y="554">Energy scale, validate against a reference meter</text>
    <text x="488" y="576">MQTT credentials, needed before that output is on</text>
  </g>

  <rect x="472" y="620" width="352" height="88" rx="8" fill="none" stroke="#d0d7de"/>
  <text x="488" y="646" font-size="15" font-weight="600" fill="#1f2328">Verified</text>
  <line x1="488" y1="658" x2="808" y2="658" stroke="#d8dee4"/>
  <g font-size="12" fill="#59636e">
    <text x="488" y="680">Bus, unit ids, register maps and scale factors read</text>
    <text x="488" y="698">from the running router and formatter, 22 October 2026.</text>
  </g>

  <line x1="452" y1="228" x2="452" y2="564" stroke="#59636e" stroke-width="2"/>
  <line x1="432" y1="228" x2="445" y2="228" stroke="#59636e" stroke-width="2" marker-end="url(#flow)"/>
  <line x1="432" y1="396" x2="445" y2="396" stroke="#59636e" stroke-width="2" marker-end="url(#flow)"/>
  <line x1="432" y1="564" x2="445" y2="564" stroke="#59636e" stroke-width="2" marker-end="url(#flow)"/>
  <line x1="452" y1="312" x2="465" y2="312" stroke="#59636e" stroke-width="2" marker-end="url(#flow)"/>
  <circle cx="452" cy="228" r="4" fill="#59636e"/>
  <circle cx="452" cy="312" r="4" fill="#59636e"/>
  <circle cx="452" cy="396" r="4" fill="#59636e"/>
  <circle cx="452" cy="564" r="4" fill="#59636e"/>
  <text x="452" y="304" font-size="12" fill="#59636e" text-anchor="middle">RTU</text>

  <line x1="24" y1="728" x2="824" y2="728" stroke="#d0d7de"/>
  <text x="24" y="748" font-size="11.5" fill="#59636e">Sensor mapping is data, not code: unit id, function code, register offsets and scale per field.</text>
  <text x="24" y="764" font-size="11.5" fill="#59636e">Reference device RUT906, firmware branch RUT9M_R_00.07.24.x. Version 3, 22 October 2026</text>
</svg>
