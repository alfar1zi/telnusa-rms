<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 660" width="1240" height="660" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <text x="32" y="44" font-size="21" font-weight="600" fill="#111827">Field installation: RUT906 with three sensors</text>
  <text x="32" y="70" font-size="13" fill="#6b7280">One RS485 bus, polling and formatting on the router, delivery to the NMS over MQTT TLS or HTTPS.</text>

  <g>
    <rect x="32" y="98" width="352" height="150" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="50" y="124" font-size="15" font-weight="600" fill="#111827">1 Solar charge controller</text>
    <text x="50" y="144" font-size="12" fill="#475569">IPANDEE, Modbus RTU, unit 2, function 3</text>
    <text x="50" y="168" font-size="11.5" fill="#374151">pv_voltage, register 2, divide by 10, V</text>
    <text x="50" y="185" font-size="11.5" fill="#374151">charging_current, register 4, divide by 10, A</text>
    <text x="50" y="202" font-size="11.5" fill="#374151">output_voltage, register 5, divide by 10, V</text>
    <text x="50" y="219" font-size="11.5" fill="#374151">load_current, register 7, divide by 10, A</text>
    <text x="50" y="238" font-size="11" fill="#0f766e">four contracted fields, eight more for diagnostics</text>
  </g>

  <g>
    <rect x="32" y="262" width="352" height="150" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="50" y="288" font-size="15" font-weight="600" fill="#111827">2 Three-phase energy meter</text>
    <text x="50" y="308" font-size="12" fill="#475569">PZEM-6L24, Modbus RTU, unit 1, function 4</text>
    <text x="50" y="332" font-size="11.5" fill="#374151">a, b, c voltage, registers 1, 2, 3, divide by 10, V</text>
    <text x="50" y="349" font-size="11.5" fill="#374151">a, b, c current, registers 4, 5, 6, divide by 100, A</text>
    <text x="50" y="366" font-size="11.5" fill="#374151">energy, register 59, 32 bit pair</text>
    <text x="50" y="388" font-size="11" fill="#b45309">energy is published as read, reference check still open</text>
  </g>

  <g>
    <rect x="32" y="426" width="352" height="132" rx="10" fill="#ecfdf5" stroke="#059669"/>
    <text x="50" y="452" font-size="15" font-weight="600" fill="#064e3b">3 Pyranometer</text>
    <text x="50" y="472" font-size="12" fill="#065f46">Honde RD-PSR-01, Modbus RTU, unit 3, function 3</text>
    <text x="50" y="496" font-size="11.5" fill="#065f46">solar_radiation, holding register 1, one register</text>
    <text x="50" y="513" font-size="11.5" fill="#065f46">16 bit, high byte first, published 1:1 in W/m2</text>
    <text x="50" y="535" font-size="11" fill="#065f46">integrated and reporting, item rut.solar.radiation</text>
  </g>

  <g>
    <rect x="424" y="150" width="14" height="330" rx="4" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="462" y="176" font-size="13" font-weight="600" fill="#111827">RS485 bus, terminals A and B</text>
    <text x="462" y="200" font-size="11.5" fill="#475569">one master, the router, three slaves</text>
    <text x="462" y="218" font-size="11.5" fill="#475569">9600 baud, 8 data bits, no parity</text>
    <text x="462" y="236" font-size="11.5" fill="#475569">one stop bit, flow control off, half duplex</text>
    <text x="462" y="254" font-size="11.5" fill="#475569">common ground shared by every device</text>
    <text x="462" y="286" font-size="11.5" fill="#94a3b8">port /dev/rs485, exposed as /dev/ttyS1</text>
    <text x="462" y="304" font-size="11.5" fill="#94a3b8">each server polled every 20 seconds</text>
  </g>

  <g>
    <rect x="800" y="150" width="204" height="330" rx="12" fill="#eef2ff" stroke="#4f46e5"/>
    <text x="818" y="180" font-size="16" font-weight="600" fill="#312e81">Teltonika RUT906</text>
    <line x1="818" y1="192" x2="986" y2="192" stroke="#c7d2fe"/>
    <text x="818" y="214" font-size="12" font-weight="600" fill="#312e81">1 Modbus client</text>
    <text x="818" y="232" font-size="11.5" fill="#3730a3">polls three servers</text>
    <text x="818" y="258" font-size="12" font-weight="600" fill="#312e81">2 Combined input</text>
    <text x="818" y="276" font-size="11.5" fill="#3730a3">twelve fields, one payload</text>
    <text x="818" y="302" font-size="12" font-weight="600" fill="#312e81">3 Lua formatter</text>
    <text x="818" y="320" font-size="11.5" fill="#3730a3">applies the scale factors,</text>
    <text x="818" y="336" font-size="11.5" fill="#3730a3">adds site id, serial, epoch</text>
    <text x="818" y="362" font-size="12" font-weight="600" fill="#312e81">4 Publish every 20 s</text>
    <text x="818" y="380" font-size="11.5" fill="#3730a3">MQTT over TLS, port 8883</text>
    <text x="818" y="396" font-size="11.5" fill="#3730a3">or HTTPS to the ingest API</text>
    <text x="818" y="422" font-size="12" font-weight="600" fill="#312e81">On the device</text>
    <text x="818" y="440" font-size="11.5" fill="#3730a3">MQTT output configured</text>
    <text x="818" y="456" font-size="11.5" fill="#3730a3">and currently disabled, so</text>
    <text x="818" y="472" font-size="11.5" fill="#3730a3">HTTPS carries telemetry</text>
  </g>

  <g>
    <rect x="1044" y="150" width="164" height="330" rx="12" fill="#ecfdf5" stroke="#059669"/>
    <text x="1060" y="180" font-size="15" font-weight="600" fill="#064e3b">TELNUSA NMS</text>
    <line x1="1060" y1="192" x2="1192" y2="192" stroke="#a7f3d0"/>
    <text x="1060" y="214" font-size="11.5" fill="#065f46">validates identity,</text>
    <text x="1060" y="230" font-size="11.5" fill="#065f46">time and ranges</text>
    <text x="1060" y="254" font-size="11.5" fill="#065f46">registers the device</text>
    <text x="1060" y="278" font-size="11.5" fill="#065f46">queues for Zabbix</text>
    <text x="1060" y="302" font-size="11.5" fill="#065f46">keeps latest state</text>
    <text x="1060" y="326" font-size="11.5" fill="#065f46">publishes live updates</text>
    <text x="1060" y="350" font-size="11.5" fill="#065f46">evaluates alarm rules</text>
    <line x1="1060" y1="368" x2="1192" y2="368" stroke="#a7f3d0"/>
    <text x="1060" y="390" font-size="11.5" fill="#065f46">Zabbix 7.4 stores</text>
    <text x="1060" y="406" font-size="11.5" fill="#065f46">history and problems</text>
    <text x="1060" y="430" font-size="11.5" fill="#065f46">the API serves ranges,</text>
    <text x="1060" y="446" font-size="11.5" fill="#065f46">rollups and reports</text>
    <text x="1060" y="470" font-size="11.5" fill="#065f46">remote access stays</text>
    <text x="1060" y="486" font-size="11.5" fill="#065f46">server side and audited</text>
  </g>

  <path d="M 384 172 H 414" stroke="#4b5563" stroke-width="2" fill="none"/>
  <path d="M 384 336 H 414" stroke="#4b5563" stroke-width="2" fill="none"/>
  <path d="M 384 492 H 414" stroke="#4b5563" stroke-width="2" fill="none"/>
  <path d="M 438 315 H 790" stroke="#4b5563" stroke-width="2" fill="none"/>
  <path d="M 1004 315 H 1034" stroke="#4b5563" stroke-width="2" fill="none"/>
  <text x="560" y="306" font-size="11" fill="#6b7280">Modbus RTU requests</text>
  <text x="880" y="306" font-size="11" fill="#6b7280">published payload</text>

  <text x="32" y="592" font-size="12" fill="#6b7280">Sensor mapping is data, not code: unit id, function code, register offsets and a scale factor per field.</text>
  <text x="32" y="612" font-size="12" fill="#6b7280">A sensor that is not wired or not verified stays out of the contract, and its readings render as NO DATA.</text>
  <text x="32" y="638" font-size="11.5" fill="#9ca3af">Reference device: Teltonika RUT906, firmware branch RUT9M_R_00.07.24.x, RS485 on /dev/rs485.</text>
</svg>
