<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 848 528" width="848" height="528" role="img" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <title>System architecture and workflow</title>
  <desc>Telemetry path from the field site through two transports into the TELNUSA NMS, then to the monitoring core and the operator. Remote access: authorised session, server side target, native WebUI or console over a private overlay.</desc>
  <defs>
    <marker id="flow" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect width="848" height="528" fill="#161b22"/>
  <text x="24" y="44" font-size="18" font-weight="600" fill="#e6edf3">System architecture and workflow</text>
  <text x="24" y="66" font-size="12.5" fill="#8b949e">Telemetry path first, remote access second. Every line runs one way and its intent is on the numbered key.</text>

  <g font-size="11.5" fill="#8b949e">
    <rect x="24" y="84" width="14" height="14" rx="2" fill="none" stroke="#30363d"/>
    <text x="44" y="95">Platform element</text>
    <rect x="184" y="84" width="14" height="14" rx="2" fill="rgba(187,128,9,0.15)" stroke="#9e6a03"/>
    <text x="204" y="95">Open item</text>
    <circle cx="297" cy="91" r="7" fill="#1f6feb"/>
    <text x="310" y="95">Flow step</text>
  </g>
  <line x1="24" y1="110" x2="824" y2="110" stroke="#30363d"/>

  <text x="24" y="132" font-size="11" font-weight="600" fill="#8b949e" letter-spacing="0.32">TELEMETRY PATH</text>
  <text x="24" y="316" font-size="11" font-weight="600" fill="#8b949e" letter-spacing="0.32">ACCESS PATH</text>

  <rect x="24" y="144" width="256" height="148" rx="8" fill="none" stroke="#30363d"/>
  <text x="40" y="170" font-size="15" font-weight="600" fill="#e6edf3">Field site</text>
  <text x="40" y="188" font-size="12" fill="#8b949e">RUT906, three Modbus sensors</text>
  <line x1="40" y1="200" x2="264" y2="200" stroke="#21262d"/>
  <g font-size="13">
    <text x="40" y="226" fill="#e6edf3">bus and poll</text>
    <text x="264" y="226" fill="#e6edf3" text-anchor="end">9600 8N1, 20 s</text>
    <text x="40" y="250" fill="#e6edf3">publishes</text>
    <text x="264" y="250" fill="#e6edf3" text-anchor="end">12 fields</text>
    <text x="40" y="274" fill="#8b949e">no inbound port on the device</text>
  </g>

  <rect x="296" y="144" width="256" height="148" rx="8" fill="none" stroke="#30363d"/>
  <text x="312" y="170" font-size="15" font-weight="600" fill="#e6edf3">Transports</text>
  <text x="312" y="188" font-size="12" fill="#8b949e">two paths, one contract</text>
  <line x1="312" y1="200" x2="536" y2="200" stroke="#21262d"/>
  <g font-size="13">
    <text x="312" y="226" fill="#e6edf3">MQTT over TLS</text>
    <text x="536" y="226" fill="#8b949e" text-anchor="end">8883, off</text>
    <text x="312" y="250" fill="#e6edf3">HTTPS ingest</text>
    <text x="536" y="250" fill="#8b949e" text-anchor="end">443, active</text>
    <text x="312" y="274" fill="#8b949e">retry 10 times, 1 s timeout</text>
  </g>

  <rect x="568" y="144" width="256" height="148" rx="8" fill="none" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="584" y="170" font-size="15" font-weight="600" fill="#e6edf3">TELNUSA NMS</text>
  <text x="584" y="188" font-size="12" fill="#8b949e">one Python service, SQLite state</text>
  <line x1="584" y1="200" x2="808" y2="200" stroke="#21262d"/>
  <g font-size="13">
    <text x="584" y="226" fill="#e6edf3">validate and register</text>
    <text x="584" y="250" fill="#e6edf3">queue for Zabbix</text>
    <text x="584" y="274" fill="#e6edf3">serve API and live updates</text>
  </g>

  <rect x="24" y="332" width="256" height="148" rx="8" fill="none" stroke="#30363d"/>
  <text x="40" y="358" font-size="15" font-weight="600" fill="#e6edf3">Monitoring core</text>
  <text x="40" y="376" font-size="12" fill="#8b949e">Zabbix 7.4 and Grafana 13</text>
  <line x1="40" y1="388" x2="264" y2="388" stroke="#21262d"/>
  <g font-size="13">
    <text x="40" y="414" fill="#e6edf3">12 trapper items</text>
    <text x="40" y="438" fill="#e6edf3">history, rollups, gaps</text>
    <text x="40" y="462" fill="#e6edf3">problems for the alarm view</text>
  </g>

  <rect x="296" y="332" width="256" height="148" rx="8" fill="none" stroke="#30363d"/>
  <text x="312" y="358" font-size="15" font-weight="600" fill="#e6edf3">Operator</text>
  <text x="312" y="376" font-size="12" fill="#8b949e">authenticated session</text>
  <line x1="312" y1="388" x2="536" y2="388" stroke="#21262d"/>
  <g font-size="13">
    <text x="312" y="414" fill="#e6edf3">dashboard, monitoring</text>
    <text x="312" y="438" fill="#e6edf3">alarms, reports</text>
    <text x="312" y="462" fill="#e6edf3">remote access</text>
  </g>

  <rect x="568" y="332" width="256" height="148" rx="8" fill="none" stroke="#30363d"/>
  <text x="584" y="358" font-size="15" font-weight="600" fill="#e6edf3">Remote access</text>
  <text x="584" y="376" font-size="12" fill="#8b949e">nothing exposed publicly</text>
  <line x1="584" y1="388" x2="808" y2="388" stroke="#21262d"/>
  <g font-size="13">
    <text x="584" y="414" fill="#e6edf3">target from the registry</text>
    <text x="584" y="438" fill="#e6edf3">native WebUI, proxied</text>
    <text x="584" y="462" fill="#e6edf3">console, signed grant</text>
  </g>

  <line x1="280" y1="218" x2="290" y2="218" stroke="#8b949e" stroke-width="2" marker-end="url(#flow)"/>
  <line x1="552" y1="218" x2="562" y2="218" stroke="#8b949e" stroke-width="2" marker-end="url(#flow)"/>
  <line x1="280" y1="406" x2="290" y2="406" stroke="#8b949e" stroke-width="2" marker-end="url(#flow)"/>
  <line x1="552" y1="406" x2="562" y2="406" stroke="#8b949e" stroke-width="2" marker-end="url(#flow)"/>
  <path d="M 696 292 L 696 306 L 152 306 L 152 322" fill="none" stroke="#8b949e" stroke-width="2" marker-end="url(#flow)"/>
  <g font-size="11" font-weight="600" fill="#161b22" text-anchor="middle">
    <circle cx="288" cy="218" r="8" fill="#1f6feb"/><text x="288" y="222">1</text>
    <circle cx="560" cy="218" r="8" fill="#1f6feb"/><text x="560" y="222">2</text>
    <circle cx="424" cy="306" r="8" fill="#1f6feb"/><text x="424" y="310">3</text>
    <circle cx="288" cy="406" r="8" fill="#1f6feb"/><text x="288" y="410">4</text>
    <circle cx="560" cy="406" r="8" fill="#1f6feb"/><text x="560" y="414">5</text>
  </g>
  <text x="24" y="502" font-size="12" fill="#8b949e">1 publish   2 deliver   3 queue and store   4 read history and problems   5 authorise</text>

  <line x1="24" y1="514" x2="824" y2="514" stroke="#30363d"/>
  <text x="824" y="524" font-size="11.5" fill="#8b949e" text-anchor="end">Version 3, 22 October 2026</text>
</svg>
