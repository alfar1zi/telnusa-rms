<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 848 784" width="848" height="784" role="img" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Field installation and data flow</title>
  <desc>Three Modbus sensors on one RS485 bus, polled by a Teltonika RUT906 every 20 seconds. The router publishes twelve fields to the TELNUSA NMS. Register maps and scale factors are listed per sensor.</desc>
  <defs>
    <marker id="flow" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect width="848" height="784" fill="#0d1117"/>
  <text x="24" y="44" font-size="18" font-weight="600" fill="#e6edf3">Field installation and data flow</text>
  <text x="24" y="66" font-size="12.5" fill="#8b949e">Three Modbus sensors on one RS485 bus, polled by a Teltonika RUT906 every 20 seconds.</text>

  <g font-size="11.5" fill="#8b949e">
    <rect x="24" y="84" width="14" height="14" rx="2" fill="#161b22" stroke="#30363d"/>
    <text x="44" y="95">Field</text>
    <rect x="136" y="84" width="14" height="14" rx="2" fill="rgba(56,139,253,0.15)" stroke="#1f6feb"/>
    <text x="156" y="95">Edge, router</text>
    <rect x="288" y="84" width="14" height="14" rx="2" fill="rgba(46,160,67,0.15)" stroke="#2ea043"/>
    <text x="308" y="95">Platform</text>
    <rect x="424" y="84" width="14" height="14" rx="2" fill="rgba(187,128,9,0.15)" stroke="#9e6a03" stroke-dasharray="5 3"/>
    <text x="444" y="95">Open item</text>
  </g>
  <line x1="24" y1="110" x2="824" y2="110" stroke="#30363d"/>

  <!-- left column: sensors -->
  <rect x="24" y="128" width="408" height="160" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="40" y="154" font-size="15" font-weight="600" fill="#e6edf3">MPPT charge controller</text>
  <text x="40" y="172" font-size="12" fill="#8b949e">IPANDEE, unit 2, function 3, 12 registers polled</text>
  <line x1="40" y1="184" x2="416" y2="184" stroke="#21262d"/>
  <g font-size="13">
    <text x="40" y="208" fill="#c9d1d9">pv_voltage, reg 2, /10 V</text>
    <text x="416" y="208" fill="#8b949e" text-anchor="end">rut.mppt.pv.v</text>
    <text x="40" y="230" fill="#c9d1d9">charging_current, reg 4, /10 A</text>
    <text x="416" y="230" fill="#8b949e" text-anchor="end">rut.mppt.pv.a</text>
    <text x="40" y="252" fill="#c9d1d9">output_voltage, reg 5, /10 V</text>
    <text x="416" y="252" fill="#8b949e" text-anchor="end">rut.mppt.out.v</text>
    <text x="40" y="274" fill="#c9d1d9">load_current, reg 7, /10 A</text>
    <text x="416" y="274" fill="#8b949e" text-anchor="end">rut.mppt.out.a</text>
  </g>

  <rect x="24" y="304" width="408" height="144" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="40" y="330" font-size="15" font-weight="600" fill="#e6edf3">Three-phase energy meter</text>
  <text x="40" y="348" font-size="12" fill="#8b949e">PZEM-6L24, unit 1, function 4, 8 registers polled</text>
  <line x1="40" y1="360" x2="416" y2="360" stroke="#21262d"/>
  <g font-size="13">
    <text x="40" y="384" fill="#c9d1d9">voltage a/b/c, regs 1, 2, 3, /10</text>
    <text x="416" y="384" fill="#8b949e" text-anchor="end">rut.pzem.[abc].voltage</text>
    <text x="40" y="406" fill="#c9d1d9">current a/b/c, regs 4, 5, 6, /100</text>
    <text x="416" y="406" fill="#8b949e" text-anchor="end">rut.pzem.[abc].current</text>
    <text x="40" y="428" fill="#c9d1d9">energy, reg 59, two registers</text>
    <text x="416" y="428" fill="#8b949e" text-anchor="end">rut.pzem.energy.kwh</text>
  </g>

  <rect x="24" y="464" width="408" height="96" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="40" y="490" font-size="15" font-weight="600" fill="#e6edf3">Pyranometer</text>
  <text x="40" y="508" font-size="12" fill="#8b949e">Honde RD-PSR-01, unit 3, function 3, one 16 bit register, high byte first</text>
  <line x1="40" y1="520" x2="416" y2="520" stroke="#21262d"/>
  <text x="40" y="544" font-size="13" fill="#c9d1d9">solar_radiation, reg 1, 1:1 W/m2</text>
  <text x="416" y="544" font-size="13" fill="#8b949e" text-anchor="end">rut.solar.radiation</text>

  <rect x="24" y="576" width="408" height="112" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="40" y="602" font-size="15" font-weight="600" fill="#e6edf3">RS485 bus</text>
  <text x="40" y="620" font-size="12" fill="#8b949e">one master, three slaves, two wire</text>
  <line x1="40" y1="632" x2="416" y2="632" stroke="#21262d"/>
  <g font-size="13" fill="#c9d1d9">
    <text x="40" y="656">port /dev/rs485, exposed as /dev/ttyS1</text>
    <text x="40" y="678">9600 baud, 8 data bits, no parity, half duplex</text>
  </g>

  <!-- bus and the single gateway link -->
  <line x1="452" y1="208" x2="452" y2="512" stroke="#8b949e" stroke-width="2"/>
  <line x1="432" y1="208" x2="445" y2="208" stroke="#8b949e" stroke-width="2" marker-end="url(#flow)"/>
  <line x1="432" y1="376" x2="445" y2="376" stroke="#8b949e" stroke-width="2" marker-end="url(#flow)"/>
  <line x1="432" y1="512" x2="445" y2="512" stroke="#8b949e" stroke-width="2" marker-end="url(#flow)"/>
  <line x1="452" y1="292" x2="465" y2="292" stroke="#8b949e" stroke-width="2" marker-end="url(#flow)"/>
  <circle cx="452" cy="208" r="4" fill="#8b949e"/>
  <circle cx="452" cy="292" r="4" fill="#8b949e"/>
  <circle cx="452" cy="376" r="4" fill="#8b949e"/>
  <circle cx="452" cy="512" r="4" fill="#8b949e"/>
  <text x="452" y="284" font-size="12" fill="#8b949e" text-anchor="middle">RTU</text>

  <!-- right column: edge and platform -->
  <rect x="472" y="128" width="352" height="328" rx="8" fill="rgba(56,139,253,0.15)" stroke="#1f6feb"/>
  <text x="488" y="154" font-size="15" font-weight="600" fill="#a5d6ff">Teltonika RUT906</text>
  <text x="488" y="172" font-size="12" fill="#79c0ff">Modbus client and Data Sender</text>
  <line x1="488" y1="184" x2="808" y2="184" stroke="#1f6feb"/>
  <g>
    <rect x="488" y="198" width="18" height="18" rx="4" fill="rgba(56,139,253,0.15)" stroke="#1f6feb"/>
    <text x="497" y="211" font-size="11" font-weight="600" fill="#a5d6ff" text-anchor="middle">1</text>
    <text x="514" y="207" font-size="13" font-weight="600" fill="#a5d6ff">Modbus client</text>
    <text x="514" y="223" font-size="12" fill="#79c0ff">polls units 2, 1 and 3</text>

    <rect x="488" y="244" width="18" height="18" rx="4" fill="rgba(56,139,253,0.15)" stroke="#1f6feb"/>
    <text x="497" y="257" font-size="11" font-weight="600" fill="#a5d6ff" text-anchor="middle">2</text>
    <text x="514" y="253" font-size="13" font-weight="600" fill="#a5d6ff">Combined input</text>
    <text x="514" y="269" font-size="12" fill="#79c0ff">12 requests in one payload</text>

    <rect x="488" y="290" width="18" height="18" rx="4" fill="rgba(56,139,253,0.15)" stroke="#1f6feb"/>
    <text x="497" y="303" font-size="11" font-weight="600" fill="#a5d6ff" text-anchor="middle">3</text>
    <text x="514" y="299" font-size="13" font-weight="600" fill="#a5d6ff">Lua formatter</text>
    <text x="514" y="315" font-size="12" fill="#79c0ff">scale factors, identity, epoch</text>

    <rect x="488" y="336" width="18" height="18" rx="4" fill="rgba(56,139,253,0.15)" stroke="#1f6feb"/>
    <text x="497" y="349" font-size="11" font-weight="600" fill="#a5d6ff" text-anchor="middle">4</text>
    <text x="514" y="345" font-size="13" font-weight="600" fill="#a5d6ff">Publish every 20 s</text>
  </g>
  <line x1="488" y1="368" x2="808" y2="368" stroke="#1f6feb"/>
  <text x="488" y="388" font-size="11" font-weight="600" fill="#79c0ff" letter-spacing="0.32">TRANSPORT</text>
  <g font-size="13">
    <text x="488" y="410" fill="#a5d6ff">MQTT over TLS, port 8883</text>
    <rect x="712" y="398" width="76" height="18" rx="9" fill="rgba(187,128,9,0.15)" stroke="#9e6a03" stroke-dasharray="5 3"/>
    <text x="750" y="411" font-size="11" fill="#e3b341" text-anchor="middle">disabled</text>
    <text x="488" y="434" fill="#a5d6ff">HTTPS ingest, port 443</text>
    <rect x="712" y="422" width="76" height="18" rx="9" fill="rgba(46,160,67,0.15)" stroke="#2ea043"/>
    <text x="750" y="435" font-size="11" fill="#56d364" text-anchor="middle">active</text>
  </g>

  <rect x="472" y="472" width="352" height="112" rx="8" fill="rgba(187,128,9,0.15)" stroke="#9e6a03" stroke-dasharray="6 4"/>
  <text x="488" y="498" font-size="15" font-weight="600" fill="#e3b341">Open items</text>
  <line x1="488" y1="510" x2="808" y2="510" stroke="#9e6a03"/>
  <g font-size="12" fill="#e3b341">
    <text x="488" y="534">Energy scale factor, validate against a reference meter</text>
    <text x="488" y="556">MQTT credentials, needed before that output is enabled</text>
  </g>

  <rect x="472" y="600" width="352" height="88" rx="8" fill="rgba(46,160,67,0.15)" stroke="#2ea043"/>
  <text x="488" y="626" font-size="15" font-weight="600" fill="#56d364">Verified state</text>
  <line x1="488" y1="638" x2="808" y2="638" stroke="#2ea043"/>
  <g font-size="12" fill="#3fb950">
    <text x="488" y="660">Bus, unit ids, register maps and scale factors read from</text>
    <text x="488" y="678">the running router and its formatter on 22 October 2026.</text>
  </g>

  <line x1="24" y1="720" x2="824" y2="720" stroke="#30363d"/>
  <text x="24" y="740" font-size="11.5" fill="#6e7681">Sensor mapping is data, not code: unit id, function code, register offsets and scale per field.</text>
  <text x="24" y="756" font-size="11.5" fill="#6e7681">Reference device RUT906, firmware branch RUT9M_R_00.07.24.x. Version 2.</text>
</svg>
