<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 648" width="1400" height="648" role="img" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <title>System architecture and workflow, one deployment</title>
  <desc>Architecture diagram. The field site publishes telemetry over MQTT TLS or HTTPS. The TELNUSA NMS validates, registers, queues and stores it, writes trapper values to Zabbix and reads history and problems back, and serves the operator browser. A second row shows the remote access path: authenticated session, server-side trusted target, then native WebUI or SSH console over a private overlay.</desc>
  <defs>
    <marker id="flow" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1400" height="648" fill="#ffffff"/>

  <text x="32" y="56" font-size="20" font-weight="600" fill="#111827">System architecture and workflow, one deployment</text>
  <text x="32" y="80" font-size="14" fill="#4b5563">Telemetry path on the first row, remote access path on the second. Every line is a single direction with its intent on the label.</text>

  <g font-size="12" fill="#4b5563">
    <rect x="836" y="38" width="16" height="16" rx="2" fill="#ffffff" stroke="#d1d5db"/>
    <text x="860" y="51">Field</text>
    <rect x="924" y="38" width="16" height="16" rx="2" fill="#eef2ff" stroke="#a5b4fc"/>
    <text x="948" y="51">Application</text>
    <rect x="1044" y="38" width="16" height="16" rx="2" fill="#ecfdf5" stroke="#6ee7b7"/>
    <text x="1068" y="51">Monitoring core</text>
    <rect x="1200" y="38" width="16" height="16" rx="2" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="1224" y="51">Operator and access</text>
  </g>
  <line x1="32" y1="96" x2="1368" y2="96" stroke="#d1d5db"/>

  <text x="40" y="128" font-size="12" font-weight="600" fill="#4b5563" letter-spacing="0.32">TELEMETRY PATH</text>
  <text x="40" y="472" font-size="12" font-weight="600" fill="#4b5563" letter-spacing="0.32">REMOTE ACCESS PATH</text>

  <!-- row A: telemetry path -->
  <rect x="40" y="176" width="232" height="176" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <text x="56" y="204" font-size="16" font-weight="600" fill="#111827">Field site</text>
  <text x="56" y="224" font-size="12" fill="#4b5563">RUT906 with three sensors</text>
  <line x1="56" y1="236" x2="256" y2="236" stroke="#e5e7eb"/>
  <g font-size="12">
    <text x="56" y="260" fill="#1f2937">sensors</text>
    <text x="256" y="260" fill="#0f766e" text-anchor="end">three units</text>
    <text x="56" y="284" fill="#1f2937">bus</text>
    <text x="256" y="284" fill="#0f766e" text-anchor="end">9600 8N1</text>
    <text x="56" y="308" fill="#1f2937">poll</text>
    <text x="256" y="308" fill="#0f766e" text-anchor="end">20 s</text>
    <text x="56" y="332" fill="#1f2937">publishes</text>
    <text x="256" y="332" fill="#0f766e" text-anchor="end">12 fields</text>
  </g>

  <rect x="312" y="176" width="232" height="176" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="328" y="204" font-size="16" font-weight="600" fill="#312e81">Transports</text>
  <text x="328" y="224" font-size="12" fill="#3730a3">two paths, one contract</text>
  <line x1="328" y1="236" x2="528" y2="236" stroke="#a5b4fc"/>
  <g font-size="12">
    <text x="328" y="260" fill="#312e81">MQTT TLS</text>
    <text x="528" y="260" fill="#3730a3" text-anchor="end">8883, disabled</text>
    <text x="328" y="284" fill="#312e81">HTTPS</text>
    <text x="528" y="284" fill="#3730a3" text-anchor="end">443, active</text>
    <text x="328" y="308" fill="#312e81">retry</text>
    <text x="528" y="308" fill="#3730a3" text-anchor="end">10 attempts</text>
    <text x="328" y="332" fill="#312e81">identity</text>
    <text x="528" y="332" fill="#3730a3" text-anchor="end">site, serial, epoch</text>
  </g>

  <rect x="584" y="176" width="232" height="176" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="600" y="204" font-size="16" font-weight="600" fill="#312e81">TELNUSA NMS</text>
  <text x="600" y="224" font-size="12" fill="#3730a3">one Python service</text>
  <line x1="600" y1="236" x2="800" y2="236" stroke="#a5b4fc"/>
  <g font-size="12">
    <text x="600" y="260" fill="#312e81">validation</text>
    <text x="800" y="260" fill="#3730a3" text-anchor="end">sanity, whitelist</text>
    <text x="600" y="284" fill="#312e81">registry</text>
    <text x="800" y="284" fill="#3730a3" text-anchor="end">on first payload</text>
    <text x="600" y="308" fill="#312e81">queue</text>
    <text x="800" y="308" fill="#3730a3" text-anchor="end">durable, bounded</text>
    <text x="600" y="332" fill="#312e81">latest state</text>
    <text x="800" y="332" fill="#3730a3" text-anchor="end">SQLite</text>
  </g>

  <rect x="856" y="176" width="232" height="176" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="872" y="204" font-size="16" font-weight="600" fill="#064e3b">Monitoring core</text>
  <text x="872" y="224" font-size="12" fill="#047857">Zabbix and Grafana</text>
  <line x1="872" y1="236" x2="1072" y2="236" stroke="#6ee7b7"/>
  <g font-size="12">
    <text x="872" y="260" fill="#065f46">items</text>
    <text x="1072" y="260" fill="#047857" text-anchor="end">12 trapper</text>
    <text x="872" y="284" fill="#065f46">history</text>
    <text x="1072" y="284" fill="#047857" text-anchor="end">rollups, gaps</text>
    <text x="872" y="308" fill="#065f46">problems</text>
    <text x="1072" y="308" fill="#047857" text-anchor="end">alarm rules</text>
    <text x="872" y="332" fill="#065f46">dashboards</text>
    <text x="1072" y="332" fill="#047857" text-anchor="end">fleet overview</text>
  </g>

  <rect x="1128" y="176" width="232" height="176" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="1144" y="204" font-size="16" font-weight="600" fill="#4c1d95">Operator</text>
  <text x="1144" y="224" font-size="12" fill="#5b21b6">authenticated session</text>
  <line x1="1144" y1="236" x2="1344" y2="236" stroke="#c4b5fd"/>
  <g font-size="12">
    <text x="1144" y="260" fill="#4c1d95">dashboard</text>
    <text x="1344" y="260" fill="#5b21b6" text-anchor="end">state, alarms</text>
    <text x="1144" y="284" fill="#4c1d95">monitoring</text>
    <text x="1344" y="284" fill="#5b21b6" text-anchor="end">charts per metric</text>
    <text x="1144" y="308" fill="#4c1d95">reports</text>
    <text x="1344" y="308" fill="#5b21b6" text-anchor="end">XLSX, print</text>
    <text x="1144" y="332" fill="#4c1d95">remote access</text>
    <text x="1344" y="332" fill="#5b21b6" text-anchor="end">WebUI, console</text>
  </g>

  <line x1="274" y1="296" x2="306" y2="296" stroke="#475569" stroke-width="2" marker-end="url(#flow)"/>
  <line x1="546" y1="296" x2="578" y2="296" stroke="#475569" stroke-width="2" marker-end="url(#flow)"/>
  <line x1="818" y1="296" x2="850" y2="296" stroke="#475569" stroke-width="2" marker-end="url(#flow)"/>
  <line x1="1090" y1="296" x2="1122" y2="296" stroke="#475569" stroke-width="2" marker-end="url(#flow)"/>
  <g font-size="12" fill="#475569" text-anchor="middle">
    <text x="290" y="168">publish</text>
    <text x="562" y="168">deliver</text>
    <text x="834" y="168">trapper values</text>
    <text x="1106" y="168">history and problems</text>
  </g>

  <!-- row B: remote access path -->
  <rect x="40" y="400" width="424" height="160" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="56" y="428" font-size="16" font-weight="600" fill="#4c1d95">Authorised session</text>
  <text x="56" y="448" font-size="12" fill="#5b21b6">portal authentication and roles</text>
  <line x1="56" y1="460" x2="448" y2="460" stroke="#c4b5fd"/>
  <g font-size="12">
    <text x="56" y="486" fill="#4c1d95">credentials</text>
    <text x="448" y="486" fill="#5b21b6" text-anchor="end">hashed, never in the browser</text>
    <text x="56" y="510" fill="#4c1d95">session</text>
    <text x="448" y="510" fill="#5b21b6" text-anchor="end">stored as a digest</text>
    <text x="56" y="534" fill="#4c1d95">audit</text>
    <text x="448" y="534" fill="#5b21b6" text-anchor="end">actor, action, result</text>
  </g>

  <rect x="504" y="400" width="424" height="160" rx="8" fill="#eef2ff" stroke="#a5b4fc"/>
  <text x="520" y="428" font-size="16" font-weight="600" fill="#312e81">Trusted target</text>
  <text x="520" y="448" font-size="12" fill="#3730a3">resolved on the server</text>
  <line x1="520" y1="460" x2="912" y2="460" stroke="#a5b4fc"/>
  <g font-size="12">
    <text x="520" y="486" fill="#312e81">source</text>
    <text x="912" y="486" fill="#3730a3" text-anchor="end">device registry</text>
    <text x="520" y="510" fill="#312e81">browser input</text>
    <text x="912" y="510" fill="#3730a3" text-anchor="end">never a host or a URL</text>
    <text x="520" y="534" fill="#312e81">path</text>
    <text x="912" y="534" fill="#3730a3" text-anchor="end">private overlay</text>
  </g>

  <rect x="968" y="400" width="392" height="160" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <text x="984" y="428" font-size="16" font-weight="600" fill="#111827">Device native access</text>
  <text x="984" y="448" font-size="12" fill="#4b5563">nothing exposed to the internet</text>
  <line x1="984" y1="460" x2="1344" y2="460" stroke="#e5e7eb"/>
  <g font-size="12">
    <text x="984" y="486" fill="#1f2937">WebUI</text>
    <text x="1344" y="486" fill="#0f766e" text-anchor="end">reverse proxied inside the portal</text>
    <text x="984" y="510" fill="#1f2937">console</text>
    <text x="1344" y="510" fill="#0f766e" text-anchor="end">signed grant, single use</text>
    <text x="984" y="534" fill="#1f2937">SSH</text>
    <text x="1344" y="534" fill="#0f766e" text-anchor="end">over the overlay, no public port</text>
  </g>

  <line x1="466" y1="480" x2="498" y2="480" stroke="#475569" stroke-width="2" marker-end="url(#flow)"/>
  <line x1="930" y1="480" x2="962" y2="480" stroke="#475569" stroke-width="2" marker-end="url(#flow)"/>
  <g font-size="12" fill="#475569" text-anchor="middle">
    <text x="482" y="392">authorise</text>
    <text x="946" y="392">connect</text>
  </g>

  <line x1="32" y1="588" x2="1368" y2="588" stroke="#d1d5db"/>
  <text x="32" y="612" font-size="12" fill="#6b7280">The browser never reaches MQTT, Zabbix, the database or a device directly.</text>
  <text x="1368" y="612" font-size="12" fill="#6b7280" text-anchor="end">Source: source code and host configuration read on 22 October 2026. Version 1.</text>
</svg>
