<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 848 608" width="848" height="608" role="img" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <title>System architecture and workflow</title>
  <desc>Telemetry path from the field site through two transports into the TELNUSA NMS, then to the monitoring core and the operator. Remote access path: authorised session, trusted server side target, then the native WebUI or console over a private overlay.</desc>
  <defs>
    <marker id="flow" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="848" height="608" fill="#ffffff"/>
  <text x="24" y="44" font-size="18" font-weight="600" fill="#111827">System architecture and workflow</text>
  <text x="24" y="66" font-size="12.5" fill="#4b5563">Telemetry path on the first row, remote access path on the second. Every line is single direction with its intent on the label.</text>

  <g font-size="11.5" fill="#4b5563">
    <rect x="24" y="84" width="14" height="14" rx="2" fill="#ffffff" stroke="#d1d5db"/>
    <text x="44" y="95">Field</text>
    <rect x="152" y="84" width="14" height="14" rx="2" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="172" y="95">Application</text>
    <rect x="316" y="84" width="14" height="14" rx="2" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="336" y="95">Monitoring core</text>
    <rect x="504" y="84" width="14" height="14" rx="2" fill="#f0fdfa" stroke="#5eead4"/>
    <text x="524" y="95">Operator and access</text>
    <rect x="696" y="84" width="14" height="14" rx="2" fill="#fffbeb" stroke="#fcd34d" stroke-dasharray="5 3"/>
    <text x="716" y="95">Open item</text>
  </g>
  <line x1="24" y1="110" x2="824" y2="110" stroke="#d1d5db"/>

  <!-- row 1: telemetry path -->
  <rect x="24" y="128" width="256" height="172" rx="8" fill="#ffffff" stroke="#d1d5db"/>
  <text x="40" y="154" font-size="15" font-weight="600" fill="#111827">Field site</text>
  <text x="40" y="172" font-size="12" fill="#4b5563">RUT906 with three sensors</text>
  <line x1="40" y1="184" x2="264" y2="184" stroke="#e5e7eb"/>
  <g font-size="13">
    <text x="40" y="208" fill="#374151">sensors</text>
    <text x="264" y="208" fill="#334155" text-anchor="end">three units</text>
    <text x="40" y="230" fill="#374151">bus</text>
    <text x="264" y="230" fill="#334155" text-anchor="end">9600 8N1</text>
    <text x="40" y="252" fill="#374151">poll</text>
    <text x="264" y="252" fill="#334155" text-anchor="end">20 s</text>
    <text x="40" y="274" fill="#374151">publishes</text>
    <text x="264" y="274" fill="#334155" text-anchor="end">12 fields</text>
  </g>

  <rect x="296" y="128" width="256" height="172" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="312" y="154" font-size="15" font-weight="600" fill="#1e3a8a">Transports</text>
  <text x="312" y="172" font-size="12" fill="#1d4ed8">two paths, one contract</text>
  <line x1="312" y1="184" x2="536" y2="184" stroke="#bfdbfe"/>
  <g font-size="13">
    <text x="312" y="208" fill="#1e3a8a">MQTT TLS</text>
    <text x="536" y="208" fill="#1d4ed8" text-anchor="end">8883, off</text>
    <text x="312" y="230" fill="#1e3a8a">HTTPS</text>
    <text x="536" y="230" fill="#1d4ed8" text-anchor="end">443, active</text>
    <text x="312" y="252" fill="#1e3a8a">retry</text>
    <text x="536" y="252" fill="#1d4ed8" text-anchor="end">10 attempts</text>
    <text x="312" y="274" fill="#1e3a8a">identity</text>
    <text x="536" y="274" fill="#1d4ed8" text-anchor="end">site, serial, epoch</text>
  </g>

  <rect x="568" y="128" width="256" height="172" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="584" y="154" font-size="15" font-weight="600" fill="#1e3a8a">TELNUSA NMS</text>
  <text x="584" y="172" font-size="12" fill="#1d4ed8">one Python service</text>
  <line x1="584" y1="184" x2="808" y2="184" stroke="#bfdbfe"/>
  <g font-size="13">
    <text x="584" y="208" fill="#1e3a8a">validation</text>
    <text x="808" y="208" fill="#1d4ed8" text-anchor="end">sanity, whitelist</text>
    <text x="584" y="230" fill="#1e3a8a">registry</text>
    <text x="808" y="230" fill="#1d4ed8" text-anchor="end">first payload</text>
    <text x="584" y="252" fill="#1e3a8a">queue</text>
    <text x="808" y="252" fill="#1d4ed8" text-anchor="end">durable</text>
    <text x="584" y="274" fill="#1e3a8a">latest state</text>
    <text x="808" y="274" fill="#1d4ed8" text-anchor="end">SQLite</text>
  </g>

  <!-- row 2: reading and remote access -->
  <rect x="24" y="332" width="256" height="172" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="40" y="358" font-size="15" font-weight="600" fill="#4c1d95">Monitoring core</text>
  <text x="40" y="376" font-size="12" fill="#6d28d9">Zabbix and Grafana</text>
  <line x1="40" y1="388" x2="264" y2="388" stroke="#ddd6fe"/>
  <g font-size="13">
    <text x="40" y="412" fill="#4c1d95">items</text>
    <text x="264" y="412" fill="#6d28d9" text-anchor="end">12 trapper</text>
    <text x="40" y="434" fill="#4c1d95">history</text>
    <text x="264" y="434" fill="#6d28d9" text-anchor="end">rollups, gaps</text>
    <text x="40" y="456" fill="#4c1d95">problems</text>
    <text x="264" y="456" fill="#6d28d9" text-anchor="end">alarm rules</text>
    <text x="40" y="478" fill="#4c1d95">dashboards</text>
    <text x="264" y="478" fill="#6d28d9" text-anchor="end">fleet view</text>
  </g>

  <rect x="296" y="332" width="256" height="172" rx="8" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="312" y="358" font-size="15" font-weight="600" fill="#134e4a">Operator</text>
  <text x="312" y="376" font-size="12" fill="#0f766e">authenticated session</text>
  <line x1="312" y1="388" x2="536" y2="388" stroke="#99f6e4"/>
  <g font-size="13">
    <text x="312" y="412" fill="#134e4a">dashboard</text>
    <text x="536" y="412" fill="#0f766e" text-anchor="end">state, alarms</text>
    <text x="312" y="434" fill="#134e4a">monitoring</text>
    <text x="536" y="434" fill="#0f766e" text-anchor="end">charts, ranges</text>
    <text x="312" y="456" fill="#134e4a">reports</text>
    <text x="536" y="456" fill="#0f766e" text-anchor="end">XLSX, print</text>
    <text x="312" y="478" fill="#134e4a">remote access</text>
    <text x="536" y="478" fill="#0f766e" text-anchor="end">WebUI, console</text>
  </g>

  <rect x="568" y="332" width="256" height="172" rx="8" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="584" y="358" font-size="15" font-weight="600" fill="#134e4a">Remote access</text>
  <text x="584" y="376" font-size="12" fill="#0f766e">nothing exposed publicly</text>
  <line x1="584" y1="388" x2="808" y2="388" stroke="#99f6e4"/>
  <g font-size="13">
    <text x="584" y="412" fill="#134e4a">target</text>
    <text x="808" y="412" fill="#0f766e" text-anchor="end">from registry</text>
    <text x="584" y="434" fill="#134e4a">browser</text>
    <text x="808" y="434" fill="#0f766e" text-anchor="end">never a host</text>
    <text x="584" y="456" fill="#134e4a">WebUI</text>
    <text x="808" y="456" fill="#0f766e" text-anchor="end">proxied</text>
    <text x="584" y="478" fill="#134e4a">console</text>
    <text x="808" y="478" fill="#0f766e" text-anchor="end">signed grant</text>
  </g>

  <!-- links -->
  <line x1="280" y1="214" x2="290" y2="214" stroke="#475569" stroke-width="2" marker-end="url(#flow)"/>
  <line x1="552" y1="214" x2="562" y2="214" stroke="#475569" stroke-width="2" marker-end="url(#flow)"/>
  <line x1="280" y1="418" x2="290" y2="418" stroke="#475569" stroke-width="2" marker-end="url(#flow)"/>
  <line x1="552" y1="418" x2="562" y2="418" stroke="#475569" stroke-width="2" marker-end="url(#flow)"/>
  <path d="M 696 300 L 696 316 L 152 316 L 152 326" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#flow)"/>
  <g font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">
    <circle cx="288" cy="214" r="8" fill="#475569"/><text x="288" y="218">1</text>
    <circle cx="560" cy="214" r="8" fill="#475569"/><text x="560" y="218">2</text>
    <circle cx="424" cy="316" r="8" fill="#475569"/><text x="424" y="320">3</text>
    <circle cx="288" cy="418" r="8" fill="#475569"/><text x="288" y="422">4</text>
    <circle cx="560" cy="418" r="8" fill="#475569"/><text x="560" y="422">5</text>
  </g>
  <text x="24" y="536" font-size="12" fill="#4b5563">1 publish   2 deliver   3 queued trapper values   4 history and problems   5 authorise</text>

  <line x1="24" y1="556" x2="824" y2="556" stroke="#d1d5db"/>
  <text x="24" y="576" font-size="11.5" fill="#6b7280">The browser never reaches MQTT, Zabbix, the database or a device directly.</text>
  <text x="24" y="592" font-size="11.5" fill="#6b7280">Source: code and host configuration read on 22 October 2026. Version 2.</text>
</svg>
