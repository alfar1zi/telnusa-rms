# [HISTORICAL / REFERENCE CONFIGURATION - NON-PRODUCTION]
# Canonical production Apache configuration is: deployment/apache-telnusa.conf
# TELNUSA NMS - Reference Apache Virtual Host Configuration
# Prerequisites:
# a2enmod proxy proxy_http proxy_http2 rewrite headers
# a2enmod ssl (for HTTPS - required before production deployment)
#
# Assumes:
# - dist/ deployed to /var/www/telnusa-nms/dist/
# - Backend (Python/Node integration service) bound to 127.0.0.1:8080
# - SSE stream at /api/live/* (flush needed for EventSource)
#
# To enable:
# a2ensite telnusa-nms.conf && systemctl reload apache2

<VirtualHost *:80>
    ServerName nms.example.test

    DocumentRoot /var/www/telnusa-nms/dist

    # SPA fallback: every request that is not a static asset serves index.html
    <Directory /var/www/telnusa-nms/dist>
        Options -Indexes -Includes +FollowSymLinks
        AllowOverride None
        Require all granted

        # Serve existing files/dirs directly; fall back to index.html for SPA routes
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]
    </Directory>

    # Live updates, declared before the generic API block
    # flushpackets=on forces Apache to forward partial chunks immediately
    <Location "/api/live/">
        ProxyPass        http://127.0.0.1:8080/api/live/ flushpackets=on flushwait=1
        ProxyPassReverse http://127.0.0.1:8080/api/live/

        # SSE requires keep-alive; disable buffering
        SetEnv proxy-sendchunked 1
        SetEnv proxy-nokeepalive 0
    </Location>

    # API proxy - backend is loopback-only, not directly reachable
    <Location "/api/">
        ProxyPass        http://127.0.0.1:8080/api/
        ProxyPassReverse http://127.0.0.1:8080/api/
    </Location>

    # Security headers
    Header always set X-Content-Type-Options    "nosniff"
    Header always set X-Frame-Options           "DENY"
    Header always set Referrer-Policy           "strict-origin-when-cross-origin"
    Header always set X-XSS-Protection          "0"
    Header always set Permissions-Policy        "camera=(), microphone=(), geolocation=()"

    # CSP: 'self' for scripts/styles; data: for Chart.js canvas export;
    # blob: for Chart.js image generation; connect-self for API/SSE.
    # Tighten before production: remove 'unsafe-inline' if bundler outputs hashes.
    Header always set Content-Security-Policy \
        "default-src 'self'; \
         script-src  'self' 'unsafe-inline'; \
         style-src   'self' 'unsafe-inline'; \
         img-src     'self' data: blob:; \
         connect-src 'self'; \
         font-src    'self'; \
         object-src  'none'; \
         base-uri    'self'; \
         form-action 'self';"

    # NOTE: HSTS omitted intentionally - add only after HTTPS is confirmed:
    #  Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # Logging
    ErrorLog  ${APACHE_LOG_DIR}/telnusa-nms-error.log
    CustomLog ${APACHE_LOG_DIR}/telnusa-nms-access.log combined
</VirtualHost>

